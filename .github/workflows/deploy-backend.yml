name: Deploy Backend → AWS EC2

on:
  push:
    branches: [main]
    paths:
      - 'mstc-platform/backend/**'
      - 'mstc-platform/infrastructure/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mstc-backend
  STACK_NAME: mstc-platform

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # Job 1: Infraestructura (CloudFormation)
  # ══════════════════════════════════════════════════════════════════════════

  infrastructure:
    name: Update Infrastructure
    runs-on: ubuntu-latest

    outputs:
      ec2_ip: ${{ steps.outputs.outputs.ec2_ip }}
      rds_endpoint: ${{ steps.outputs.outputs.rds_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy/Update CloudFormation Stack
        run: |
          # Verificar si el stack existe
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Stack status: $STACK_STATUS"

          if [ "$STACK_STATUS" = "NOT_FOUND" ]; then
            echo "Creando stack..."
            aws cloudformation create-stack \
              --stack-name ${{ env.STACK_NAME }} \
              --template-body file://mstc-platform/infrastructure/cloudformation/mstc-stack.yml \
              --parameters \
                ParameterKey=ProjectName,ParameterValue=mstc \
                ParameterKey=DBPassword,ParameterValue=${{ secrets.DB_PASSWORD }} \
                ParameterKey=DBUsername,ParameterValue=${{ secrets.DB_USERNAME }} \
                ParameterKey=DBName,ParameterValue=${{ secrets.DB_NAME }} \
                ParameterKey=SSHKeyName,ParameterValue=${{ secrets.SSH_KEY_NAME }} \
                ParameterKey=AllowedSSHCidr,ParameterValue=0.0.0.0/0 \
                ParameterKey=DomainName,ParameterValue=api.fundacionmujeressintechodecristal.org \
              --capabilities CAPABILITY_NAMED_IAM \
              --tags Key=Project,Value=mstc Key=Environment,Value=production

            echo "Esperando a que el stack se cree..."
            aws cloudformation wait stack-create-complete --stack-name ${{ env.STACK_NAME }}
          elif [[ "$STACK_STATUS" == *"COMPLETE"* ]] && [ "$STACK_STATUS" != "DELETE_COMPLETE" ]; then
            echo "Actualizando stack..."
            aws cloudformation update-stack \
              --stack-name ${{ env.STACK_NAME }} \
              --template-body file://mstc-platform/infrastructure/cloudformation/mstc-stack.yml \
              --parameters \
                ParameterKey=ProjectName,UsePreviousValue=true \
                ParameterKey=DBPassword,UsePreviousValue=true \
                ParameterKey=DBUsername,UsePreviousValue=true \
                ParameterKey=DBName,UsePreviousValue=true \
                ParameterKey=SSHKeyName,UsePreviousValue=true \
                ParameterKey=AllowedSSHCidr,ParameterValue=0.0.0.0/0 \
                ParameterKey=DomainName,UsePreviousValue=true \
              --capabilities CAPABILITY_NAMED_IAM 2>/dev/null || echo "No hay cambios en la infraestructura"

            aws cloudformation wait stack-update-complete --stack-name ${{ env.STACK_NAME }} 2>/dev/null || true
          else
            echo "Stack en estado $STACK_STATUS — saltando actualización"
          fi

      - name: Obtener outputs del stack
        id: outputs
        run: |
          EC2_IP=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ServerIP`].OutputValue' --output text)
          RDS_ENDPOINT=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DatabaseEndpoint`].OutputValue' --output text)

          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT
          echo "EC2 IP: $EC2_IP"
          echo "RDS: $RDS_ENDPOINT"

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2: Build Docker image y push a ECR
  # ══════════════════════════════════════════════════════════════════════════

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: infrastructure

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repositorio ECR si no existe
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Build y push imagen Docker
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: mstc-platform/backend
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          IMAGE_LATEST="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

          echo "Building: $IMAGE_URI"

          docker build \
            --tag "$IMAGE_URI" \
            --tag "$IMAGE_LATEST" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref_name }}" \
            .

          docker push "$IMAGE_URI"
          docker push "$IMAGE_LATEST"

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Imagen publicada: $IMAGE_URI"

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3: Deploy al EC2
  # ══════════════════════════════════════════════════════════════════════════

  deploy:
    name: Deploy to EC2
    needs: [infrastructure, build-and-push]
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://api.fundacionmujeressintechodecristal.org/api/v1/health

    steps:
      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar SSH
        env:
          EC2_IP: ${{ needs.infrastructure.outputs.ec2_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy al servidor
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          EC2_IP: ${{ needs.infrastructure.outputs.ec2_ip }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 $USER@$EC2_IP << ENDSSH
            set -e

            echo "══════════════════════════════════════════"
            echo "  Deploying: $IMAGE"
            echo "══════════════════════════════════════════"

            # Login a ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              \$(echo "$IMAGE" | cut -d/ -f1)

            # Pull nueva imagen
            docker pull "$IMAGE"

            # Parar contenedor actual (si existe)
            docker stop mstc-backend 2>/dev/null || true
            docker rm mstc-backend 2>/dev/null || true

            # Arrancar con memoria limitada (t3.micro = 1GB total)
            docker run -d --name mstc-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              --memory=512m \
              --env-file /opt/mstc/app/.env \
              -v /opt/mstc/keys:/app/keys:ro \
              -e JAVA_OPTS="-Xmx384m -Xms256m -XX:+UseG1GC" \
              "$IMAGE"

            # Esperar a que el health check pase
            echo "Esperando que el backend arranque..."
            for i in \$(seq 1 24); do
              if curl -sf http://localhost:8080/actuator/health/liveness > /dev/null 2>&1; then
                echo "✅ Backend listo (intento \$i)"
                exit 0
              fi
              sleep 5
            done

            echo "❌ Backend no respondió en 120 segundos"
            docker logs mstc-backend --tail 50
            exit 1
          ENDSSH

      - name: Verificar health check público
        if: success()
        run: |
          sleep 5
          curl -sf "https://api.fundacionmujeressintechodecristal.org/api/v1/health" || \
            echo "⚠️ Health check público no respondió (DNS/SSL puede tardar)"

      - name: Limpiar imágenes antiguas en ECR
        if: success()
        run: |
          IMAGES=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --query 'sort_by(imageDetails,&imagePushedAt)[:-5].imageDigest' \
            --output text 2>/dev/null || echo "")

          if [ -n "$IMAGES" ] && [ "$IMAGES" != "None" ]; then
            for digest in $IMAGES; do
              aws ecr batch-delete-image \
                --repository-name ${{ env.ECR_REPOSITORY }} \
                --image-ids imageDigest=$digest 2>/dev/null || true
            done
            echo "🧹 Imágenes antiguas eliminadas"
          fi
