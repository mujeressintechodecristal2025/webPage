name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mstc-platform/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mstc-platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: mstc-platform/frontend
        run: npm ci

      - name: Run tests
        working-directory: mstc-platform/frontend
        run: npm run test

      - name: Build
        working-directory: mstc-platform/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WHATSAPP_NUMBER: '573188307155'
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
          VITE_APP_ENV: production
        run: npm run build

      - name: Copy index.html as 404.html
        working-directory: mstc-platform/frontend
        run: cp dist/index.html dist/404.html

      - name: Create redirect script for SPA
        working-directory: mstc-platform/frontend
        run: |
          # Create a simple redirect for all routes
          for route in transparencia politica-de-privacidad; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mstc-platform/frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
