# ══════════════════════════════════════════════════════════════════════════════
# Docker Compose — Producción (EC2)
# Solo corre el backend como contenedor.
# PostgreSQL está en RDS (gestionado por AWS).
# Logs: logback-spring.xml escribe JSON a /var/log/mstc/application.json
#        → CloudWatch Agent (host) lee ese archivo y lo envía a CloudWatch.
# ══════════════════════════════════════════════════════════════════════════════

services:

  backend:
    image: ${ECR_IMAGE:-mstc-backend:latest}
    container_name: mstc-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - /opt/mstc/app/.env
    volumes:
      # Claves JWT generadas por CloudFormation/user_data
      - /opt/mstc/keys:/app/keys:ro
      # Logs: el contenedor escribe en /var/log/mstc → host monta el mismo path
      # CloudWatch Agent en el host lee /var/log/mstc/application.json
      - /var/log/mstc:/var/log/mstc
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
