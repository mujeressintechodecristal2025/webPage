# ============================================================
# Configuración de PRODUCCIÓN — application-prod.yml
# Todos los valores sensibles vienen de variables de entorno
# NUNCA hardcodear secrets aquí
# ============================================================

spring:
  datasource:
    url:      ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      url:      ${REDIS_URL}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 2000ms

  mail:
    host:     ${SMTP_HOST}
    port:     ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none              # Flyway gestiona el schema — no validar

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    org.mstc: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/mstc/application.log

# ── S3 AWS ───────────────────────────────────────────────────────────────────
mstc:
  storage:
    endpoint:          ""          # Vacío = AWS S3 real
    access-key:        ${AWS_ACCESS_KEY_ID}
    secret-key:        ${AWS_SECRET_ACCESS_KEY}
    region:            ${AWS_REGION:us-east-1}
    path-style-access: false

# ── Pasarelas de pago (producción) ───────────────────────────────────────────
payment:
  nequi:
    base-url:       https://api.nequi.com.co
    client-id:      ${NEQUI_CLIENT_ID}
    client-secret:  ${NEQUI_CLIENT_SECRET}
    webhook-secret: ${NEQUI_WEBHOOK_SECRET}
  daviplata:
    base-url:       https://api.daviplata.com
    api-key:        ${DAVIPLATA_API_KEY}
    webhook-secret: ${DAVIPLATA_WEBHOOK_SECRET}
  pse:
    base-url:       https://api.achcolombia.com.co
    merchant-id:    ${PSE_MERCHANT_ID}
    api-key:        ${PSE_API_KEY}
    webhook-secret: ${PSE_WEBHOOK_SECRET}
